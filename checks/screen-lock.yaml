# walk away, screen locks within 15 min
id: screen-lock
title: Screen lock
category: device
why: If you walk away, anyone nearby can use your unlocked computer.
platforms: [windows, macos, linux]
severity: medium
probe: screen_lock_status
expect:
  status: "on"
benchmark: CIS 4.3 · NIST AC-11
open:
  macos: x-apple.systempreferences:com.apple.Lock-Screen-Settings.extension
  windows: ms-settings:powersleep
fix:
  macos:
    - Open System Settings → Lock Screen.
    - Set "Turn display off when inactive" to 10 minutes or less.
    - Set "Require password after screen saver begins or display is turned off" to Immediately.
  windows:
    - Open Settings → System → Power & battery.
    - Set sleep to 10 minutes or less.
    - Then open Settings → Accounts → Sign-in options and set "If you've been away" to "When PC wakes up from sleep".
  linux:
    - GNOME - open Settings → Privacy → Screen Lock.
    - Turn on Automatic Screen Lock and set Blank Screen Delay to 10 minutes or less.
    - KDE - open System Settings → Screen Locking and turn on Lock automatically after 10 minutes.
