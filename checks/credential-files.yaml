# saved logins and keys
id: credential-files
title: "Saved logins and keys"
category: accounts
why: "Cloud keys, git passwords and tokens sit in plain files. If other users can read them, one slip hands over your accounts."
platforms: [windows, macos, linux]
severity: medium
probe: credential_files
expect:
  status: "ok"
benchmark: CIS 3.11 · NIST IA-5 · MITRE T1552.001
fix:
  macos:
    - "Click \"Fix it for me\" to lock these files to your account."
    - "Prefer a credential helper or the keychain over plain-text passwords."
  windows:
    - "Right-click each file → Properties → Security and remove other users."
    - "Prefer Windows Credential Manager over plain-text passwords."
  linux:
    - "Click \"Fix it for me\" to lock these files to your account."
    - "Prefer a credential helper over plain-text passwords."
