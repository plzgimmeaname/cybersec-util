# blocks other computers from reaching yours without asking
id: firewall
title: Firewall
category: network
why: Without it, other computers on the same Wi-Fi can try to reach yours directly.
platforms: [windows, macos, linux]
severity: high
probe: firewall_status
expect:
  status: "on"
benchmark: CIS 4.5 · NIST SC-7
open:
  macos: x-apple.systempreferences:com.apple.Network-Settings.extension
  windows: ms-settings:windowsdefender
fix:
  macos:
    - Open System Settings → Network → Firewall.
    - Turn the firewall on.
    - Click Options and turn on stealth mode, so your Mac won't answer strangers.
  windows:
    - Open Windows Security → Firewall & network protection.
    - For each one (Domain, Private, Public) that says off, click it and turn it on.
  linux:
    - Open the command window.
    - Type sudo ufw enable and press Enter.
    - Type your password when it asks.
    - If ufw is not found, type sudo apt install ufw first (Ubuntu / Debian).
